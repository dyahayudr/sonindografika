<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="Kantong kresek plastik HD">
<defs>
  <!-- base colour of the HDPE film: lighter where light hits (top-left), deeper at the folds -->
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a991ff"/><stop offset=".45" stop-color="#7457f5"/><stop offset="1" stop-color="#3f27a3"/>
  </linearGradient>
  <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#14063f" stop-opacity=".55"/><stop offset=".14" stop-color="#14063f" stop-opacity=".12"/>
    <stop offset=".5" stop-color="#14063f" stop-opacity="0"/>
    <stop offset=".86" stop-color="#14063f" stop-opacity=".16"/><stop offset="1" stop-color="#14063f" stop-opacity=".6"/>
  </linearGradient>
  <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".6" stop-color="#14063f" stop-opacity="0"/><stop offset="1" stop-color="#14063f" stop-opacity=".45"/>
  </linearGradient>
  <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/><stop offset=".4" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
  </linearGradient>

  <!-- crinkled plastic: fractal noise used as a height map, lit diffusely (multiply) + specular glints (add) -->
  <filter id="plastic" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <!-- large soft creases + fine crinkle, combined into one height map -->
    <feTurbulence type="turbulence" baseFrequency="0.011 0.008" numOctaves="2" seed="4" result="big"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="9" result="fine"/>
    <feComposite in="big" in2="fine" operator="arithmetic" k1="0" k2=".75" k3=".35" k4="0" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation=".6" result="noiseSoft"/>
    <feDiffuseLighting in="noiseSoft" surfaceScale="3" diffuseConstant="1.15" lighting-color="#ffffff" result="diff">
      <feDistantLight azimuth="225" elevation="62"/>
    </feDiffuseLighting>
    <feBlend in="SourceGraphic" in2="diff" mode="multiply" result="shaded"/>
    <feSpecularLighting in="noiseSoft" surfaceScale="4" specularConstant=".8" specularExponent="18" lighting-color="#ffffff" result="spec">
      <feDistantLight azimuth="225" elevation="40"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feComposite in="shaded" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".6" k4="0" result="lit"/>
    <feComposite in="lit" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <!-- printed ink follows the creases of the film -->
  <filter id="inkWarp" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.008" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>

  <path id="bag" d="M47 324 C44 250 40 156 40 80 Q40 27 72 22 L96 20 Q110 20 110 35 L110 82 Q150 114 190 82 L190 35 Q190 20 204 20 L228 22 Q260 27 260 80 C260 156 256 250 253 324 Q226 329 200 327 Q175 331 150 328 Q124 331 100 327 Q74 330 47 324 Z"/>
  <clipPath id="clip"><use href="#bag"/></clipPath>
</defs>

<!-- film body -->
<use href="#bag" fill="url(#film)" fill-opacity=".94" filter="url(#plastic)"/>

<g clip-path="url(#clip)">
  <!-- back layer visible inside the mouth -->
  <path d="M110 82 Q150 114 190 82 L190 96 Q150 126 110 96 Z" fill="#2a1580" fill-opacity=".55"/>
  <path d="M112 84 Q150 112 188 84" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.2"/>

  <!-- side gussets: folded-in film along both edges -->
  <path d="M60 26 C63 60 64 110 62 150 C61 210 62 270 64 326" fill="none" stroke="#1a0b57" stroke-opacity=".45" stroke-width="2" filter="url(#soft)"/>
  <path d="M62 30 C65 62 66 110 64 150 C63 210 64 270 66 326" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.2"/>
  <path d="M240 26 C237 60 236 110 238 150 C239 210 238 270 236 326" fill="none" stroke="#1a0b57" stroke-opacity=".45" stroke-width="2" filter="url(#soft)"/>
  <path d="M238 30 C235 62 234 110 236 150 C237 210 236 270 234 326" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.2"/>
  <rect x="0" y="0" width="300" height="340" fill="url(#sideShade)"/>
  <rect x="0" y="0" width="300" height="340" fill="url(#bottomShade)"/>

  <!-- stress creases pulled from the handles, plus sag folds near the bottom -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#ffffff" stroke-opacity=".26" stroke-width="3" filter="url(#soft)">
      <path d="M74 92 C92 120 108 150 118 196"/>
      <path d="M226 92 C210 122 194 150 186 190"/>
      <path d="M96 96 C112 116 124 132 132 150"/>
      <path d="M60 262 C100 276 132 282 172 276 C200 272 224 266 242 258"/>
      <path d="M152 236 C160 250 170 262 184 270"/>
    </g>
    <g stroke="#160848" stroke-opacity=".32" stroke-width="2.4" filter="url(#soft)">
      <path d="M79 90 C97 120 113 152 123 198"/>
      <path d="M221 90 C205 122 189 152 181 192"/>
      <path d="M62 270 C102 284 134 290 174 284 C202 280 226 274 244 266"/>
      <path d="M100 300 C120 296 140 298 160 306"/>
    </g>
  </g>

  <!-- specular sheen streaks -->
  <path d="M82 36 C76 120 78 220 86 318" stroke="#ffffff" stroke-opacity=".45" stroke-width="14" fill="none" filter="url(#softer)"/>
  <path d="M84 50 C79 130 80 210 86 300" stroke="#ffffff" stroke-opacity=".5" stroke-width="2.5" fill="none" filter="url(#soft)"/>
  <path d="M214 112 C222 190 220 250 212 316" stroke="#ffffff" stroke-opacity=".2" stroke-width="10" fill="none" filter="url(#softer)"/>

  <!-- one-colour print (logo + wordmark), warped by the crinkles -->
  <g filter="url(#inkWarp)" fill="#ffffff" fill-opacity=".9">
    <g transform="translate(150 186)">
      <circle r="31" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="3.2"/>
      <path d="M-17 -17h17c5.5 0 8.5 3.2 8.5 7.2 0 2.7-1.3 4.6-3.2 5.8h-22.3z"/>
      <path d="M17 17H0c-5.5 0-8.5-3.2-8.5-7.2 0-2.7 1.3-4.6 3.2-5.8h22.3z" fill="#ffd3ea"/>
    </g>
    <text x="150" y="240" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2" textLength="132" lengthAdjust="spacingAndGlyphs">SONINDOGRAFIKA</text>
    <text x="150" y="256" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, Helvetica, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.5" fill-opacity=".75">PLASTIK HD · JABODETABEK</text>
  </g>

  <!-- heat-sealed bottom edge -->
  <path d="M40 312 Q100 318 150 316 Q200 318 262 312 L262 340 L40 340 Z" fill="url(#seal)"/>
  <path d="M48 316 Q100 321 150 319 Q200 321 252 316" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1" stroke-dasharray="1.5 2.5"/>
</g>

<!-- thin bright rim where the film edge catches light, cut edges of the handles slightly darker -->
<use href="#bag" fill="none" stroke="#e6dcff" stroke-opacity=".55" stroke-width="1.2"/>
<path d="M110 36 L110 82 Q150 114 190 82 L190 36" fill="none" stroke="#2a1580" stroke-opacity=".5" stroke-width="1.4"/>
</svg>
